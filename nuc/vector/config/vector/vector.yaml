data_dir: /var/lib/vector

secret:
  locket:
    type: directory
    path: /run/secrets/locket
    remove_trailing_whitespace: true

sources:
  docker:
    type: docker_logs
    docker_host: http://socket-proxy:2375
    # Prefix match on container name, skips this stack to avoid feedback loops
    exclude_containers:
      - vector
      - locket-vector

transforms:
  shape_docker:
    type: remap
    inputs:
      - docker
    source: |
      labels = object(.label) ?? {}
      .stack = labels."com.docker.compose.project" || "standalone"
      .service = labels."com.docker.compose.service" || .container_name
      .source = "docker"
      del(.label)
      del(.container_id)
      del(.container_created_at)
      del(.source_type)

      raw = string(.message) ?? ""
      parsed = null

      # 1. JSON lines
      if starts_with(raw, "{") {
        parsed = object(parse_json(raw) ?? null) ?? null
      }

      # 2. logfmt (grafana, alertmanager, ...). Must start with key=value so prose mentioning level= is left alone
      if parsed == null && match(raw, r'^[A-Za-z_][\w.-]*=') && match(raw, r'\b(level|lvl)=') {
        parsed = parse_logfmt(raw) ?? null
      }

      # 3. VictoriaMetrics/VictoriaLogs default format: TIME<TAB>LEVEL<TAB>CALLER<TAB>MSG
      if parsed == null {
        parsed = parse_regex(raw, r'^\d{4}-\d{2}-\d{2}T\S+\t(?P<level>[a-z]+)\t(?P<caller>\S+)\t(?P<msg>.*)$') ?? null
      }

      if parsed != null {
        p = object!(parsed)
        msg = p.msg || p.message || p.MESSAGE || p.error || null
        lvl = p.level || p.lvl || p.severity || null

        # error is only redundant if it was used as the message
        if p.msg == null && p.message == null && p.MESSAGE == null {
          p = remove!(p, ["error"])
        }

        # Never let app fields clobber ours or VictoriaLogs' reserved fields, and drop anything that looks like a credential
        reserved = [
          "msg", "message", "MESSAGE", "level", "lvl", "severity",
          "timestamp", "time", "ts", "t",
          "host", "service", "stack", "source", "source_type",
          "stream", "image", "container_name", "container_id", "container_created_at", "label",
          "_msg", "_time", "_stream", "_stream_id"
        ]
        p = filter(p) -> |key, _value| { !includes(reserved, key) }
        p = filter(flatten(p)) -> |key, _value| {
          !match(key, r'(?i)(authorization|cookie|passw(or)?d|secret|token|api[_-]?key)')
        }

        . = merge(., p)
        if msg != null { .message = msg }
        if lvl != null { .level = lvl }
      }

      # Normalise level names. Numeric levels follow the pino/bunyan scale
      if is_integer(.level) {
        n = int!(.level)
        .level = if n >= 60 { "fatal" }
          else if n >= 50 { "error" }
          else if n >= 40 { "warn" }
          else if n >= 30 { "info" }
          else if n >= 20 { "debug" }
          else if n >= 10 { "trace" }
          else { null }
      } else if .level != null {
        l = downcase(string(.level) ?? "")
        .level = if l == "warning" || l == "wrn" { "warn" }
          else if l == "err" || l == "eror" { "error" }
          else if l == "inf" { "info" }
          else if l == "dbg" { "debug" }
          else if l == "crit" || l == "critical" || l == "panic" { "fatal" }
          else if l == "" { null }
          else { l }
      }
      if .level == null { del(.level) }
  # Sends apps that need their own handling to the steps below. Everything else goes through split._unmatched
  split:
    type: route
    inputs:
      - shape_docker
    route:
      caddy: '.stack == "proxy" && .service == "caddy"'
      lldap: '.service == "lldap"'
      postgres: 'starts_with(string(.image) ?? "", "postgres:")'
      redis: 'starts_with(string(.image) ?? "", "redis:")'
      cloudflared: 'starts_with(string(.image) ?? "", "cloudflare/cloudflared:")'
      forgejo: 'starts_with(string(.image) ?? "", "codeberg.org/forgejo/forgejo:")'
  # The proxy's Caddyfile sets message_key to _msg. Logs with an error field already use it as the message
  caddy_fix:
    type: remap
    inputs:
      - split.caddy
    source: |
      parsed = object(parse_json(string(.message) ?? "") ?? null) ?? {}
      if is_string(parsed._msg) && parsed.error == null { .message = parsed._msg }

      # Clients can send credentials in the query string, which the field name filter can't see
      if .level == "access" {
        .uri = replace(string(.uri) ?? "", r'(?i)([?&](?:api_?key|access_?token|token|auth|password|secret)=)[^&]*', "$1[redacted]")
      }
  # LLDAP logs: TIME  LEVEL  TREE ICON [level]: MESSAGE. The tree and icon show how lines nest
  lldap_fix:
    type: remap
    inputs:
      - split.lldap
    source: |
      line = parse_regex(string(.message) ?? "", r'^\S+\s+(?P<level>[A-Z]+)\s+(?P<text>.*)$') ?? null
      if line != null {
        .level = downcase(string!(line.level))
        text = string!(line.text)
        inner = parse_regex(text, r'^[^\[]*\[[a-z]+\]:\s*(?P<text>.*)$') ?? null
        .message = if inner != null { inner.text } else { replace(text, r'^[┕┝│━─\s]+', "") }

        login = parse_regex(string!(.message), r'^Login attempt for "(?P<user>[^"]*)"') ?? null
        if login != null { .user = login.user }

        # LDAP request [ 53.2ms | 100.00% ] session_id: ID
        request = parse_regex(string!(.message), r'^LDAP request \[\s*(?P<value>[\d.]+)(?P<unit>ns|µs|us|ms|s)\s*\|[^\]]*\]\s*(?:session_id:\s*(?P<session_id>\S+))?') ?? null
        if request != null {
          .message = "LDAP request"
          if request.session_id != null { .session_id = request.session_id }
          value, err = to_float(request.value)
          if err == null {
            unit = string!(request.unit)
            .duration_ms = if unit == "s" { value * 1000.0 }
              else if unit == "ms" { value }
              else if unit == "ns" { value / 1000000.0 }
              else { value / 1000.0 }
          }
        }
      }
  # Session lines are too frequent to be worth storing
  lldap_noise:
    type: filter
    inputs:
      - lldap_fix
    condition: '!match(string(.message) ?? "", r''LDAP session (start|end)\b'')'
  # Postgres logs: TIME TZ [PID] SEVERITY:  MESSAGE
  postgres_fix:
    type: remap
    inputs:
      - split.postgres
    source: |
      line = parse_regex(string(.message) ?? "", r'^\d{4}-\d{2}-\d{2} [\d:.]+ \S+ \[(?P<pid>\d+)\] (?P<severity>[A-Z0-9]+):\s+(?P<text>.*)$') ?? null
      if line != null {
        .pid = to_int(line.pid) ?? null
        severity = string!(line.severity)
        if includes(["DETAIL", "HINT", "CONTEXT", "STATEMENT", "QUERY"], severity) {
          # These add to the line before them, so they have no level of their own
          .message = severity + ": " + string!(line.text)
        } else {
          .message = line.text
          .level = if includes(["FATAL", "PANIC"], severity) { "fatal" }
            else if severity == "ERROR" { "error" }
            else if severity == "WARNING" { "warn" }
            else if starts_with(severity, "DEBUG") { "debug" }
            else { "info" }
        }
      }
  # Redis logs: PID:ROLE DD Mon YYYY HH:MM:SS.mmm LEVEL MESSAGE
  redis_fix:
    type: remap
    inputs:
      - split.redis
    source: |
      line = parse_regex(string(.message) ?? "", r'^(?P<pid>\d+):(?P<role>[XCSM]) \d{1,2} [A-Za-z]{3} \d{4} [\d:.]+ (?P<level>[.\-*#]) (?P<text>.*)$') ?? null
      if line != null {
        .message = line.text
        .pid = to_int(line.pid) ?? null
        role = string!(line.role)
        .role = if role == "M" { "master" }
          else if role == "S" { "replica" }
          else if role == "C" { "child" }
          else { "sentinel" }
        level = string!(line.level)
        .level = if level == "#" { "warn" }
          else if level == "*" { "info" }
          else { "debug" }
      }
  # Cloudflared logs: TIME LEVEL [TEXT] key=value key="value"
  cloudflared_fix:
    type: remap
    inputs:
      - split.cloudflared
    source: |
      line = parse_regex(string(.message) ?? "", r'^\S+Z (?P<level>[A-Z]{3})\s+(?P<rest>.*)$') ?? null
      if line != null {
        level = string!(line.level)
        .level = if level == "ERR" { "error" }
          else if level == "WRN" { "warn" }
          else if level == "INF" { "info" }
          else if level == "DBG" { "debug" }
          else if level == "FTL" { "fatal" }
          else { downcase(level) }

        rest = string!(line.rest)
        .message = rest
        parts = parse_regex(rest, r'^(?P<text>(?:[^=]*\s)?)(?P<fields>[A-Za-z_][\w.-]*=.*)$') ?? null
        if parts != null {
          text = strip_whitespace(string!(parts.text))
          fields = parse_logfmt(string!(parts.fields)) ?? {}

          # An error becomes the message if the line has no text of its own
          if text != "" {
            .message = text
          } else if is_string(fields.error) {
            .message = fields.error
            fields = remove!(fields, ["error"])
          }

          # Same protections as shape_docker: never overwrite our fields, and drop anything that looks like a credential
          reserved = [
            "message", "level", "timestamp", "host", "service", "stack", "source", "source_type",
            "stream", "image", "container_name", "_msg", "_time", "_stream", "_stream_id"
          ]
          fields = filter(fields) -> |key, _value| {
            !includes(reserved, key) && !match(key, r'(?i)(authorization|cookie|passw(or)?d|secret|token|api[_-]?key)')
          }
          . = merge(., fields)

          # Clients can send credentials in the query string, which the field name filter can't see
          if is_string(.dest) {
            .dest = replace(string!(.dest), r'(?i)([?&](?:api_?key|access_?token|token|auth|password|secret)=)[^&]*', "$1[redacted]")
          }
        }
      }
  # Forgejo logs: YYYY/MM/DD HH:MM:SS CALLER [L] MESSAGE, where CALLER is file:line:function()
  forgejo_fix:
    type: remap
    inputs:
      - split.forgejo
    source: |
      line = parse_regex(string(.message) ?? "", r'(?s)^\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}(?: (?P<caller>\S+))? \[(?P<level>[TDIWECF])\] (?P<text>.*)$') ?? null
      if line != null {
        level = string!(line.level)
        .level = if level == "E" { "error" }
          else if level == "W" { "warn" }
          else if level == "I" { "info" }
          else if level == "D" { "debug" }
          else if level == "T" { "trace" }
          else { "fatal" }
        if line.caller != null { .caller = line.caller }
        .message = line.text

        # router: completed GET /PATH for IP:PORT, 200 OK in 240.5ms @ HANDLER
        request = parse_regex(string!(.message), r'^router: (?P<state>completed|slow|polling|failed) (?P<method>[A-Z]+) (?P<path>\S+) for (?P<addr>\S+), (?P<status>\d{3}) (?P<status_text>.*?) in (?P<value>[\d.]+)(?P<unit>ns|µs|us|ms|s)(?: @ (?P<handler>.+))?$') ?? null
        if request != null {
          # Clients can send credentials in the query string, which the field name filter can't see
          path = replace(string!(request.path), r'(?i)([?&](?:api_?key|access_?token|token|auth|password|secret)=)[^&]*', "$1[redacted]")
          .method = request.method
          .path = path
          .status = to_int(request.status) ?? null
          summary = string!(request.method) + " " + path + " " + string!(request.status) + " " + string!(request.status_text)
          .message = if request.state == "completed" { summary } else { string!(request.state) + ": " + summary }
          if request.handler != null { .handler = request.handler }
          addr = parse_regex(string!(request.addr), r'^\[?(?P<ip>[^\]]+?)\]?:\d+$') ?? null
          .remote_ip = if addr != null { addr.ip } else { request.addr }
          value, err = to_float(request.value)
          if err == null {
            unit = string!(request.unit)
            .duration_ms = if unit == "s" { value * 1000.0 }
              else if unit == "ms" { value }
              else if unit == "ns" { value / 1000000.0 }
              else { value / 1000.0 }
          }
        }
      }
  drop_empty:
    type: filter
    inputs:
      - caddy_fix
      - lldap_noise
      - postgres_fix
      - redis_fix
      - cloudflared_fix
      - forgejo_fix
      - split._unmatched
    condition: 'strip_whitespace(string(.message) ?? "") != ""'

sinks:
  to_victorialogs:
    type: http
    inputs:
      - drop_empty
    # Caddy routes the vector user to /insert/jsonline. Keep _stream_fields low cardinality
    uri: "SECRET[locket.vector_endpoint]/?_msg_field=message&_time_field=timestamp&_stream_fields=host,stack,service"
    auth:
      strategy: basic
      user: "SECRET[locket.vector_user]"
      password: "SECRET[locket.vector_password]"
    compression: gzip
    encoding:
      codec: json
    framing:
      method: newline_delimited
    batch:
      max_bytes: 1048576
      timeout_secs: 2
    # Holds logs on disk while the endpoint is unreachable, then pauses reading rather than dropping them
    buffer:
      type: disk
      max_size: 536870912
      when_full: block
