services:
  locket:
    image: ghcr.io/bpbradley/locket:op
    # OP complains about file permissions if it doesnt have 65532 user or group. TODO: https://github.com/bpbradley/locket/issues/89
    # Group 101000 matches the forgejo rootless user so it can read the injected files.
    user: "65532:101000"
    container_name: locket-forgejo
    restart: unless-stopped # tmpfs is empty after a reboot, locket has to come back up to re-inject
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      # Park is needed otherwise when the continer exits it will remove the files creates in the tmpfs volume
      - "--mode=park"
      - "--inject-failure-policy=error"
      - "--log-level=info"
      # -rw-r----- file mode, drwxr-x--- dir mode
      - "--file-mode=0640"
      - "--dir-mode=0750"
      - "--op-token=file:/run/secrets/op_token"
      # Every file in ./config/forgejo is a template with an op:// reference,
      # one secret per file so both postgres (*_FILE) and forgejo (__FILE) can read them directly.
      - "--map=/forgejo:/run/secrets/locket/forgejo"
      - "--map=/postgres:/run/secrets/locket/postgres"
    secrets:
      - op_token
    volumes:
      - ./config/forgejo:/forgejo:ro
      - ./config/postgres:/postgres:ro
      - secrets-store-forgejo:/run/secrets/locket
      - mount-to-prevent-anon-volumes-forgejo:/templates

  forgejo-db:
    image: postgres:18.4
    container_name: forgejo-db
    restart: unless-stopped
    depends_on:
      locket:
        condition: service_healthy
    # The postgres image reads *_FILE natively, no init.sh wrapper needed.
    # The entrypoint reads these as root before dropping to the postgres user.
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres/database_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres/database_password
      POSTGRES_DB_FILE: /run/secrets/postgres/database_name
      TZ: America/Chicago
    expose:
      - 5432
    volumes:
      # postgres 18+ keeps data under /var/lib/postgresql/<major>/docker, mount the parent
      - type: volume
        source: forgejo-db-data
        target: /var/lib/postgresql
      - type: volume
        source: secrets-store-forgejo
        target: /run/secrets/postgres
        read_only: true
        volume:
          subpath: postgres
    healthcheck:
      # -h forces TCP so the temporary socket-only server during first init doesn't count as ready.
      # -U and -d come from the secret files, without them pg_isready connects as root and postgres
      # logs 'role "root" does not exist' on every check
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -p 5432 -U "$$(cat /run/secrets/postgres/database_user)" -d "$$(cat /run/secrets/postgres/database_name)"']
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  forgejo:
    image: codeberg.org/forgejo/forgejo:16-rootless
    container_name: forgejo
    restart: unless-stopped
    user: 101000:101000
    depends_on:
      locket:
        condition: service_healthy
      forgejo-db:
        condition: service_healthy
    environment:
      # Non-secret settings, FORGEJO_DOMAIN comes from the dockhand stack env
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO__server__ROOT_URL: https://${FORGEJO_DOMAIN}/
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO__server__SSH_PORT: 2222
      FORGEJO__server__SSH_LISTEN_PORT: 2222
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-db:5432
      # Secrets, environment-to-ini reads __FILE values into app.ini on every start
      FORGEJO__database__NAME__FILE: /run/secrets/postgres/database_name
      FORGEJO__database__USER__FILE: /run/secrets/postgres/database_user
      FORGEJO__database__PASSWD__FILE: /run/secrets/postgres/database_password
      FORGEJO__security__SECRET_KEY__FILE: /run/secrets/forgejo/secret_key
      FORGEJO__security__INTERNAL_TOKEN__FILE: /run/secrets/forgejo/internal_token
      FORGEJO__oauth2__JWT_SECRET__FILE: /run/secrets/forgejo/jwt_secret
    volumes:
      - type: volume
        source: git-data
        target: /var/lib/gitea
        volume:
          nocopy: true # empty nfs chown permission fix
      - type: volume
        source: forgejo-config
        target: /etc/gitea # rootless image keeps app.ini here, without it config is lost on recreate
      - /etc/localtime:/etc/localtime:ro
      - type: volume
        source: secrets-store-forgejo
        target: /run/secrets/forgejo
        read_only: true
        volume:
          subpath: forgejo
      - type: volume
        source: secrets-store-forgejo
        target: /run/secrets/postgres
        read_only: true
        volume:
          subpath: postgres
    networks:
      - default
      - proxy
    ports:
      - "2222:2222"
    expose:
      - 3000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      retries: 3
      start_period: 60s
      timeout: 10s

networks:
  default: {}
  proxy:
    external: true

secrets:
  op_token:
    file: /etc/op/token

volumes:
  mount-to-prevent-anon-volumes-forgejo:
    driver: local
  git-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.1.21,rw,sync,nfsvers=4,nolock,hard"
      device: ":/mnt/thehub/Data/Code/forgjo-data"
  forgejo-config:
    driver: local
  forgejo-db-data:
    driver: local
  secrets-store-forgejo:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      # 750 not 740, group needs execute to traverse the directory
      o: uid=65532,gid=101000,mode=750
