services:
  locket:
    image: ghcr.io/bpbradley/locket:op
    user: "65532:1000"
    container_name: locket-agent
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      # Park is needed otherwise when the continer exits it will remove the files creates in the tmpfs volume
      - "--mode=park"
      - "--inject-failure-policy=error"
      - "--log-level=info"
      # -rw-r----- file mode
      - "--file-mode=0640"
      - "--dir-mode=0740"
      - "--op-token=file:/run/secrets/op_token"
      - '--secret=token=TOKEN={{ op://DockerSecrets/dockhand/epyc-token }}'
    secrets:
      - op_token
    volumes:
      - secrets-store-agent:/run/secrets/locket
      - mount-to-prevent-anon-volumes-agent:/templates

  hawser:
    container_name: hawser-epyc
    restart: unless-stopped
    image: ghcr.io/finsys/hawser:latest
    depends_on:
      locket:
        condition: service_healthy
    # Override the default entrypoint to load the token from the secret file into an environment variable without writing
    # them to disk, then exec the original entrypoint
    entrypoint: ["/bin/sh", "/init.sh", "-f", "/secrets/token"]
    command: ['/usr/local/bin/hawser']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/stacks:/opt/stacks
      - secrets-store-agent:/secrets:ro
      - ./init/init.sh:/init.sh:ro
      - mount-to-prevent-anon-volumes-agent:/data/stacks
    environment:
      - TZ=America/Chicago
      - STACKS_DIR=/opt/stacks
      - PORT=2376
      - AGENT_NAME=epyc
    ports:
      - 2376:2376
    labels:
      - dockhand.update=false

secrets:
  op_token:
    file: /etc/op/token

volumes:
  mount-to-prevent-anon-volumes-agent:
    driver: local
  secrets-store-agent:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
