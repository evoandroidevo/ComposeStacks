services:
  pve-ups:
    image: ghcr.io/ffind-dev/pve-ups:latest
    container_name: pve-ups
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      - PVE_USV_DEPLOYMENT=docker
      - TZ=America/Chicago
    volumes:
      - /mnt/usb/docker/pve-ups/config:/etc/pve-usv    # config.yaml (contains secrets, 0600)
      - /mnt/usb/docker/pve-ups/data:/var/lib/pve-usv  # events.db + persistent engine state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - default

networks:
  default: {}
