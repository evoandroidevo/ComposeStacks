route:
  receiver: discord
  # One notification per alert and source, instead of one per label combination
  group_by: [alertname, instance]
  # Wait for related alerts before the first notification, then batch updates
  group_wait: 30s
  group_interval: 5m
  # Remind about alerts that are still firing
  repeat_interval: 4h

receivers:
  - name: discord
    discord_configs:
      # Locket writes the webhook URL from 1Password to this file
      - webhook_url_file: /run/secrets/discord_webhook
        send_resolved: true

# Don't send a warning while a critical alert with the same name and source is firing
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, instance]
