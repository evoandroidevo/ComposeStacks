services:
  locket:
    image: ghcr.io/bpbradley/locket:op
    # OP complains about file permissions if it doesnt have 65532 user or group. TODO: https://github.com/bpbradley/locket/issues/89
    user: "65532:1000"
    container_name: locket-dockhand
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      # Park is needed otherwise when the continer exits it will remove the files creates in the tmpfs volume
      - "--mode=park"
      - "--inject-failure-policy=error"
      - "--log-level=info"
      # -rw-r----- file mode
      - "--file-mode=0640"
      - "--dir-mode=0740"
      - "--op-token=file:/run/secrets/op_token"
      - "--secret=encryption_key=ENCRYPTION_KEY={{ op://DockerSecrets/dockhand/encryption_key }}"
      # --secret=file name=file contents
    secrets:
      - op_token
    volumes:
      - secrets-store-dockhand:/run/secrets/locket

  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    depends_on:
      locket:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    restart: unless-stopped
    # Override the default entrypoint to load the encryption key from the secret file into an environment variable without writing
    # them to disk, then exec the original entrypoint
    # https://github.com/Finsys/dockhand/blob/main/Dockerfile
    entrypoint:
      [
        "/sbin/tini",
        "--",
        "/init.sh",
        "-f",
        "/run/secrets/locket/encryption_key",
      ]
    command: ["/usr/local/bin/docker-entrypoint.sh"]
    expose:
      - 3000
    volumes:
      - ./init/init.sh:/init.sh:ro
      - secrets-store-dockhand:/run/secrets/locket:ro
      - /opt/dockhand:/opt/dockhand
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - DATA_DIR=/opt/dockhand
      - HOST_DATA_DIR=/opt/dockhand

secrets:
  op_token:
    file: /etc/op/token

volumes:
  secrets-store-dockhand:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=1000,mode=740
